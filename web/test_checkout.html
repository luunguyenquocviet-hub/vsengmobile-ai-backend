<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test đặt hàng — VsengMobile</title>
<style>
  :root{--line:#e2e8f0;--muted:#64748b;--blue:#2563eb;--green:#16a34a;--red:#dc2626}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#f1f5f9;color:#0f172a;padding:24px}
  .wrap{max-width:980px;margin:auto}
  h1{font-size:20px;margin-bottom:4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
  .card h2{font-size:15px;margin-bottom:12px}
  input,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;
    font-size:13.5px;font-family:inherit;outline:none;margin-bottom:10px}
  input:focus,textarea:focus{border-color:var(--blue)}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{border:none;border-radius:8px;padding:10px 16px;font-weight:600;font-size:13.5px;cursor:pointer}
  .btn-blue{background:var(--blue);color:#fff;width:100%}
  .btn-sm{padding:5px 10px;font-size:12px;background:var(--blue);color:#fff}
  .btn:hover{filter:brightness(1.08)}
  .prod{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .prod img{width:46px;height:46px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .prod .nm{flex:1}.prod .nm small{color:var(--muted);display:block}
  .prod .price{font-weight:700;white-space:nowrap}
  .cart-item{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .cart-item .nm{flex:1}
  .qty{display:flex;align-items:center;gap:6px}
  .qty button{width:24px;height:24px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
  .total{display:flex;justify-content:space-between;font-size:15.5px;font-weight:800;margin:12px 0}
  .pay-opt{display:flex;gap:10px;margin-bottom:14px}
  .pay-opt label{flex:1;border:2px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;
    text-align:center;font-size:13px;color:#0f172a;font-weight:600}
  .pay-opt input{display:none}
  .pay-opt label:has(input:checked){border-color:var(--blue);background:#dbeafe}
  .muted{color:var(--muted);font-size:12.5px}
  #result{margin-top:14px;padding:12px;border-radius:10px;font-size:13.5px;display:none;white-space:pre-wrap}
  #result.ok{display:block;background:#dcfce7;color:#166534}
  #result.err{display:block;background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛒 Test đặt hàng &amp; thanh toán</h1>
  <p class="sub">Trang demo gọi <code>POST /api/orders</code> — COD hoặc Chuyển khoản QR. Đơn tạo xong sẽ hiện trong <b>admin_orders.html</b> ở tab "Chờ xác nhận".</p>

  <div class="grid">
    <div class="card">
      <h2>1️⃣ Chọn sản phẩm</h2>
      <input id="q" placeholder="Tìm điện thoại... (vd: samsung, nokia)" onkeydown="if(event.key==='Enter')search()">
      <div id="prodList" class="muted">Nhập từ khóa rồi Enter để tìm.</div>
    </div>

    <div>
      <div class="card" style="margin-bottom:16px">
        <h2>2️⃣ Giỏ hàng</h2>
        <div id="cart" class="muted">Chưa có sản phẩm.</div>
        <div class="total"><span>Tổng:</span><span id="total" style="color:var(--blue)">0₫</span></div>
      </div>

      <div class="card">
        <h2>3️⃣ Thông tin giao hàng</h2>
        <label>User ID (tài khoản đặt hàng)</label>
        <input id="user_id" type="number" value="1">
        <div class="row2">
          <div><label>Tên người nhận</label><input id="name" value="Nguyễn Văn Test"></div>
          <div><label>SĐT</label><input id="phone" value="0909123456"></div>
        </div>
        <label>Địa chỉ</label>
        <input id="address" value="12 Nguyễn Văn Bảo, Gò Vấp, TP.HCM">
        <label>Ghi chú (tùy chọn)</label>
        <input id="note" placeholder="VD: giao giờ hành chính">
        <div class="pay-opt">
          <label><input type="radio" name="pm" value="cod" checked>💵 COD</label>
          <label><input type="radio" name="pm" value="bank_qr">📱 Chuyển khoản QR</label>
        </div>
        <button class="btn btn-blue" onclick="submitOrder()">Đặt hàng</button>
        <div id="result"></div>
        <div id="qrPane" style="display:none;margin-top:14px;border:1px solid var(--line);
             border-radius:12px;padding:16px;text-align:center"></div>
      </div>
    </div>
  </div>
</div>

<script>
const API = "http://localhost:8000/api";   // đổi nếu backend chạy nơi khác
const vnd = n => Number(n||0).toLocaleString("vi-VN") + "₫";
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let cart = {};   // item_id -> {name, price, qty, stock}

async function search(){
  const q = document.getElementById("q").value.trim();
  if(!q) return;
  const el = document.getElementById("prodList");
  el.innerHTML = "Đang tìm...";
  try{
    const res = await fetch(`${API}/products/search?q=${encodeURIComponent(q)}&limit=8`);
    const d = await res.json();
    const items = d.data || [];
    el.innerHTML = items.length ? items.map(p => `
      <div class="prod">
        ${p.image ? `<img src="${esc(p.image)}" onerror="this.style.display='none'">` : ""}
        <div class="nm">${esc(p.name).slice(0,70)}<small>Kho: ${p.stock ?? "?"} · Đã bán: ${p.sold_quantity ?? 0}</small></div>
        <div class="price">${vnd(p.price)}</div>
        <button class="btn btn-sm" onclick='addToCart(${p.item_id}, ${JSON.stringify(String(p.name||"").slice(0,60))}, ${Number(p.price)||0}, ${Number(p.stock)||0})'>＋</button>
      </div>`).join("") : "Không tìm thấy sản phẩm.";
  }catch(e){ el.innerHTML = "⚠️ Không gọi được API — backend đã chạy chưa?"; }
}

function addToCart(id, name, price, stock){
  if(cart[id]) cart[id].qty++;
  else cart[id] = {name, price, qty:1, stock};
  renderCart();
}
function changeQty(id, d){
  cart[id].qty += d;
  if(cart[id].qty <= 0) delete cart[id];
  renderCart();
}
function renderCart(){
  const ids = Object.keys(cart);
  const el = document.getElementById("cart");
  let total = 0;
  el.innerHTML = ids.length ? ids.map(id => {
    const c = cart[id]; total += c.price * c.qty;
    return `<div class="cart-item"><div class="nm">${esc(c.name)}<br><small class="muted">${vnd(c.price)}</small></div>
      <div class="qty"><button onclick="changeQty(${id},-1)">−</button><b>${c.qty}</b>
      <button onclick="changeQty(${id},1)">＋</button></div></div>`;
  }).join("") : '<span class="muted">Chưa có sản phẩm.</span>';
  document.getElementById("total").textContent = vnd(total);
}

async function submitOrder(){
  const r = document.getElementById("result");
  r.className = "";
  const items = Object.entries(cart).map(([id,c]) => ({item_id:Number(id), quantity:c.qty}));
  if(!items.length){ r.className="err"; r.textContent="Giỏ hàng trống!"; return; }
  const body = {
    user_id: Number(document.getElementById("user_id").value),
    receiver_name: document.getElementById("name").value,
    receiver_phone: document.getElementById("phone").value,
    shipping_address: document.getElementById("address").value,
    note: document.getElementById("note").value || null,
    payment_method: document.querySelector('input[name="pm"]:checked').value,
    items
  };
  try{
    const res = await fetch(`${API}/orders`, {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
    const d = await res.json();
    if(!res.ok) throw new Error(typeof d.detail === "string" ? d.detail : JSON.stringify(d.detail));
    if(d.bank_transfer){
      r.className="ok";
      r.textContent = `✅ Đơn #${d.order_id} đã tạo — quét QR bên dưới để chuyển khoản.`;
      showBankQR(d);
      cart = {}; renderCart();
    } else {
      r.className="ok";
      r.textContent = `✅ Đặt hàng thành công!\nMã đơn: #${d.order_id} — Tổng: ${vnd(d.total_amount)} (COD)\n→ Mở admin_orders.html để xác nhận đơn.`;
      cart = {}; renderCart();
    }
  }catch(e){ r.className="err"; r.textContent = "❌ " + e.message; }
}

/* ===== Chuyển khoản QR: hiện QR + poll hỏi backend tiền vào chưa ===== */
let pollTimer = null;
function showBankQR(d){
  const b = d.bank_transfer;
  const pane = document.getElementById("qrPane");
  pane.style.display = "block";
  pane.innerHTML = `
    <div style="font-weight:700;margin-bottom:8px">📱 Quét mã để chuyển khoản</div>
    <img src="${b.qr_url}" style="width:230px;max-width:100%;border-radius:10px" alt="VietQR">
    <div style="font-size:13px;color:#334155;margin-top:10px;line-height:1.9">
      ${esc(b.account_name)} — ${esc(b.account_no)} (${esc(b.bank_id)})<br>
      Số tiền: <b>${vnd(b.amount)}</b> · Nội dung: <b style="color:var(--blue)">${esc(b.transfer_content)}</b><br>
      <span style="color:var(--muted);font-size:12px">Vui lòng giữ nguyên nội dung chuyển khoản để hệ thống nhận diện đơn.</span>
    </div>
    <div id="payState" style="margin-top:10px;font-weight:600;color:#d97706">⏳ Đang chờ tiền vào...</div>`;
  if(pollTimer) clearInterval(pollTimer);
  const stateEl = () => document.getElementById("payState");
  pollTimer = setInterval(async () => {
    try{
      const res = await fetch(`${API}/payment/bank/check/${d.order_id}`);
      const s = await res.json();
      if(s.paid){
        clearInterval(pollTimer);
        stateEl().style.color = "var(--green)";
        stateEl().textContent = "✅ Đã nhận được tiền — đơn chuyển sang ĐÃ THANH TOÁN!";
      } else if(s.auto_check === false){
        clearInterval(pollTimer);
        stateEl().style.color = "var(--muted)";
        stateEl().textContent = "ℹ️ " + (s.message || "Admin sẽ xác nhận thủ công khi thấy tiền vào.");
      }
    }catch(e){ /* mạng rớt thì lần poll sau thử lại */ }
  }, 8000);
}
</script>
</body>
</html>
